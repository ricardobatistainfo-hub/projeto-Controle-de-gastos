<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bússola Gastos">
<meta name="theme-color" content="#090B12">
<title>Bússola Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#090B12;
    --ink-2:#12151F;
    --parchment:#F2F5FA;
    --line:rgba(180,200,255,0.14);
    --neg:#FF5C7A;
    --essencial:#4DD4FF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;touch-action:pan-y;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(77,212,255,0.08), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(185,140,255,0.08), transparent 45%),
      var(--ink);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    background-attachment:fixed;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(180,200,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,200,255,0.035) 1px, transparent 1px);
    background-size:34px 34px;
    z-index:0;
    animation:gridDrift 40s linear infinite;
  }
  @keyframes gridDrift{0%{background-position:0 0,0 0;}100%{background-position:34px 34px,-34px 34px;}}
  .wrap{max-width:900px;margin:0 auto;padding:28px 18px 80px;position:relative;z-index:1;}

  header.top{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8FE8FF;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;margin:4px 0 0;}

  .week-hero{
    position:relative; overflow:hidden;
    display:flex;justify-content:space-between;align-items:center;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:16px;
    padding:20px 22px; margin-bottom:16px;
    background:linear-gradient(135deg, rgba(77,212,255,0.1), rgba(185,140,255,0.04));
    box-shadow:0 0 24px -14px rgba(77,212,255,0.2);
  }
  .week-hero::after{
    content:"";
    position:absolute;
    top:0; left:-60%; width:35%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.14), transparent);
    transform:skewX(-18deg);
    animation:shineSweep 7s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shineSweep{
    0%{left:-60%;}
    35%{left:130%;}
    100%{left:130%;}
  }
  .week-hero .label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--essencial);margin-bottom:6px;}
  .week-hero .total{
    font-family:'Fraunces',serif;font-size:40px;font-weight:700;line-height:1;
    background:linear-gradient(135deg,#fff,var(--essencial));-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .week-hero .range{font-size:12px;color:rgba(242,245,250,0.5);margin-top:6px;}
  .week-hero .count{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(242,245,250,0.55);line-height:1.7;}
  .week-hero .count b{color:var(--essencial);}

  .day-panel{
    position:relative;
    overflow:hidden;
    background:rgba(18,21,31,0.75);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(61,232,176,0.22);
    border-radius:16px;
    padding:20px 20px 8px;
    margin-bottom:16px;
    box-shadow:0 0 20px -14px rgba(61,232,176,0.4);
  }
  .day-panel::before{
    content:"";
    position:absolute;
    top:0; left:10%; right:10%; height:2px;
    background:linear-gradient(90deg, transparent, #3DE8B0, transparent);
    box-shadow:0 0 12px 2px rgba(61,232,176,0.6);
    animation:dayBarBreathe 3.2s ease-in-out infinite;
  }
  @keyframes dayBarBreathe{
    0%,100%{opacity:0.35; left:10%; right:10%;}
    50%{opacity:1; left:3%; right:3%;}
  }
  .day-panel .hud-corner{position:absolute;width:12px;height:12px;border:2px solid rgba(61,232,176,0.5);pointer-events:none;}
  .day-panel .hud-corner.tl{top:7px;left:7px;border-right:none;border-bottom:none;}
  .day-panel .hud-corner.tr{top:7px;right:7px;border-left:none;border-bottom:none;}
  .day-panel-top{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;margin-bottom:8px;border-bottom:1px solid var(--line);}
  .day-panel .label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:#3DE8B0;margin-bottom:5px;}
  .day-panel .total{
    font-family:'Fraunces',serif;font-size:34px;font-weight:700;line-height:1;
    background:linear-gradient(135deg,#fff,#3DE8B0);-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:totalGlow 3.2s ease-in-out infinite;
  }
  @keyframes totalGlow{
    0%,100%{filter:drop-shadow(0 0 0px rgba(61,232,176,0));}
    50%{filter:drop-shadow(0 0 10px rgba(61,232,176,0.55));}
  }
  .day-panel .range{font-size:12px;color:rgba(242,245,250,0.5);margin-top:5px;text-transform:capitalize;}
  .day-panel .count{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(242,245,250,0.55);}
  .day-panel .count b{color:#3DE8B0;}
  .day-panel-list{padding-bottom:10px;}
  .back-today-btn{
    margin-top:8px;background:rgba(61,232,176,0.12);border:1px solid rgba(61,232,176,0.4);
    color:#3DE8B0;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.04em;
    border-radius:14px;padding:5px 10px;cursor:pointer;
  }
  .back-today-btn:hover{background:rgba(61,232,176,0.2);}

  .gauge-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .pulse-wave{
    width:92px;height:92px;display:block;
    filter:drop-shadow(0 0 6px rgba(61,232,176,0.25));
  }

  #saveStatus{font-family:'JetBrains Mono',monospace;font-size:11px;margin:-10px 0 18px;color:rgba(242,245,250,0.4);}

  .panel{
    background:rgba(18,21,31,0.7);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:14px;
    padding:18px 16px; margin-bottom:16px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .panel h2{
    font-family:'JetBrains Mono',monospace;text-transform:uppercase;font-size:11px;
    letter-spacing:0.14em;color:rgba(242,245,250,0.5);margin:0 0 14px;
    display:flex;align-items:center;gap:8px;
  }
  .live-dot{width:7px;height:7px;border-radius:50%;background:#3DE8B0;box-shadow:0 0 8px 2px rgba(61,232,176,0.8);animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.35;}}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{
    display:flex;align-items:center;gap:6px;
    padding:6px 10px 6px 8px;border-radius:20px;
    font-size:12.5px;
    border:1px solid rgba(180,200,255,0.15);
    background:rgba(255,255,255,0.03);
  }
  .chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .chip button{background:none;border:none;color:rgba(242,245,250,0.35);cursor:pointer;font-size:14px;line-height:1;padding:0;}
  .chip button:hover{color:var(--neg);}
  .add-cat-row{display:flex;gap:8px;}
  .add-cat-row input{
    flex:1;min-width:120px;background:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;color:var(--parchment);font-family:'Inter',sans-serif;font-size:13.5px;
  }
  .btn{
    background:var(--essencial);border:none;color:var(--ink);font-weight:700;font-size:13px;
    border-radius:8px;padding:9px 14px;cursor:pointer;
    box-shadow:0 0 16px -4px var(--essencial);transition:transform .15s ease, box-shadow .2s ease;
  }
  .btn:hover{box-shadow:0 0 22px -2px var(--essencial);}
  .btn:active{transform:scale(0.95);}
  .btn.secondary{background:transparent;border:1px solid var(--essencial);color:var(--essencial);box-shadow:none;}

  .expense-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .expense-form .full{grid-column:1 / -1;}
  .expense-form label{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;
    color:rgba(242,245,250,0.45);display:block;margin-bottom:5px;
  }
  .expense-form input, .expense-form select{
    width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:9px 10px;color:var(--parchment);font-family:'Inter',sans-serif;font-size:13.5px;
  }
  .expense-form input:focus, .expense-form select:focus{outline:1px solid var(--essencial);border-color:var(--essencial);}
  .expense-form .full .btn{width:100%;margin-top:2px;padding:11px;font-size:14px;}

  .charts-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media (min-width:640px){.charts-grid{grid-template-columns:1fr 1fr;}}

  .donut-wrap{display:flex;align-items:center;gap:18px;}
  .donut{width:150px;height:150px;border-radius:50%;flex-shrink:0;position:relative;}
  .donut-center{
    position:absolute;inset:20px;border-radius:50%;background:var(--ink-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
  }
  .donut-center .v{font-size:15px;font-weight:700;color:var(--parchment);}
  .donut-center .l{font-size:8.5px;color:rgba(242,245,250,0.4);text-transform:uppercase;letter-spacing:0.06em;}
  .legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .legend-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .legend-row .name{flex:1;color:rgba(242,245,250,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .legend-row .val{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(242,245,250,0.6);}

  .bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .bar-col .bar{
    width:100%;max-width:26px;border-radius:6px 6px 3px 3px;
    background:linear-gradient(180deg, var(--essencial), rgba(77,212,255,0.25));
    box-shadow:0 0 10px -2px var(--essencial);
    transition:height .5s cubic-bezier(.22,1,.36,1);
    min-height:3px;
  }
  .bar-col .daylabel{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:rgba(242,245,250,0.5);text-transform:uppercase;}
  .bar-col .dayval{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:rgba(242,245,250,0.75);}
  .bar-col.today .daylabel{color:var(--essencial);font-weight:700;}

  .day-group{margin-bottom:14px;}
  .day-group:last-child{margin-bottom:0;}
  .day-group-head{
    display:flex;justify-content:space-between;align-items:center;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
    color:rgba(242,245,250,0.5);padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:6px;
  }
  .day-group-head .dtotal{color:var(--essencial);}
  .expense-row{
    display:flex;align-items:center;gap:10px;padding:8px 0;
    border-bottom:1px solid rgba(180,200,255,0.06);
    animation:rowIn .35s ease both;
  }
  @keyframes rowIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
  .expense-row:last-child{border-bottom:none;}
  .expense-row .cdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .expense-row .info{flex:1;min-width:0;}
  .expense-row .desc{font-size:13.5px;color:var(--parchment);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .expense-row .meta{font-size:11px;color:rgba(242,245,250,0.45);}
  .expense-row .amount{font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--neg);white-space:nowrap;}
  .expense-row .del{background:none;border:none;color:rgba(242,245,250,0.25);cursor:pointer;font-size:16px;padding:0 2px;}
  .expense-row .del:hover{color:var(--neg);}
  .empty-state{font-size:12.5px;color:rgba(242,245,250,0.3);font-style:italic;padding:6px 0;}

  .balance-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .balance-card{
    background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:12px;
    padding:14px;position:relative;
  }
  .balance-card .bc-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(242,245,250,0.5);margin-bottom:6px;}
  .balance-card .bc-value{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--parchment);}
  .balance-card .bc-value.neg{color:var(--neg);}
  .balance-card .bc-edit{
    position:absolute;top:10px;right:10px;background:none;border:none;
    color:rgba(242,245,250,0.3);cursor:pointer;font-size:13px;padding:2px;line-height:1;
  }
  .balance-card .bc-edit:hover{color:var(--essencial);}
  .balance-card .bc-edit-input{
    width:100%;background:var(--ink);border:1px solid var(--essencial);border-radius:6px;
    padding:6px 8px;color:var(--parchment);font-family:'Fraunces',serif;font-size:20px;font-weight:700;
  }
  .balance-card.dinheiro{border-color:rgba(61,232,176,0.25);}
  .balance-card.debito{border-color:rgba(77,212,255,0.25);}

  .period-toggle{display:inline-flex;gap:4px;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:20px;padding:3px;}
  .ptbtn{
    background:none;border:none;color:rgba(242,245,250,0.5);
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.04em;text-transform:uppercase;
    padding:5px 11px;border-radius:16px;cursor:pointer;transition:all .2s ease;
  }
  .ptbtn.active{background:var(--essencial);color:var(--ink);font-weight:700;}
  .ptbtn:disabled{opacity:0.25;cursor:not-allowed;}

  .cal-weekdays{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
    font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;
    color:rgba(242,245,250,0.4);text-align:center;margin-bottom:6px;
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{
    aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:12px;color:rgba(242,245,250,0.75);cursor:pointer;position:relative;
    background:rgba(255,255,255,0.02);border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  .cal-cell.empty{cursor:default;background:none;}
  .cal-cell:not(.empty):hover{background:rgba(77,212,255,0.1);}
  .cal-cell.has-expense{background:rgba(77,212,255,0.08);}
  .cal-cell.today{border-color:var(--essencial);color:var(--essencial);font-weight:700;}
  .cal-cell.selected{background:var(--essencial);color:var(--ink);font-weight:700;}
  .cal-cell .dot{width:4px;height:4px;border-radius:50%;background:#3DE8B0;margin-top:1px;}
  .cal-cell.selected .dot{background:var(--ink);}

  .add-screen-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .back-btn{
    background:rgba(255,255,255,0.04);border:1px solid var(--line);color:var(--parchment);
    font-family:'JetBrains Mono',monospace;font-size:12px;border-radius:8px;
    padding:8px 12px;cursor:pointer;
  }
  .back-btn:hover{border-color:var(--essencial);color:var(--essencial);}
  .add-screen-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;}

  .fab{
    position:fixed;
    bottom:28px; right:20px;
    width:58px;height:58px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--essencial), #3DE8B0);
    border:none;color:var(--ink);
    font-size:28px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 24px -4px rgba(77,212,255,0.6), 0 0 0 1px rgba(255,255,255,0.15) inset;
    z-index:5;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
    animation:fabPulse 2.6s ease-in-out infinite;
  }
  .fab:hover{transform:scale(1.08);}
  .fab:active{transform:scale(0.92);}
  @keyframes fabPulse{
    0%,100%{box-shadow:0 6px 24px -4px rgba(77,212,255,0.6), 0 0 0 1px rgba(255,255,255,0.15) inset;}
    50%{box-shadow:0 6px 34px -2px rgba(77,212,255,0.85), 0 0 0 1px rgba(255,255,255,0.15) inset;}
  }

  footer.app-footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(242,245,250,0.3);margin-top:26px;}

  :focus-visible{outline:2px solid var(--essencial);outline-offset:2px;}

  /* tela de login */
  .auth-wrap{max-width:360px;margin:14vh auto 0;padding:0 18px;position:relative;z-index:1;}
  .auth-card{
    background:rgba(18,21,31,0.75);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:16px;
    padding:26px 22px;
  }
  .auth-card h1{font-size:24px;margin:0 0 4px;text-align:center;}
  .auth-card .eyebrow{display:block;text-align:center;margin-bottom:14px;}
  .auth-field{margin-bottom:12px;}
  .auth-field label{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;
    color:rgba(242,245,250,0.45);display:block;margin-bottom:5px;
  }
  .auth-field input{
    width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:10px 11px;color:var(--parchment);font-family:'Inter',sans-serif;font-size:14px;
  }
  .auth-field input:focus{outline:1px solid var(--essencial);border-color:var(--essencial);}
  .auth-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .auth-actions .btn{width:100%;padding:11px;font-size:14px;}
  .auth-switch{text-align:center;font-size:12.5px;color:rgba(242,245,250,0.5);margin-top:14px;}
  .auth-switch button{background:none;border:none;color:var(--essencial);cursor:pointer;font-size:12.5px;padding:0;text-decoration:underline;}
  .auth-msg{font-size:12.5px;text-align:center;margin-top:12px;min-height:16px;}
  .auth-msg.error{color:var(--neg);}
  .auth-msg.ok{color:#3DE8B0;}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:rgba(242,245,250,0.3);font-size:11px;}
  .auth-divider::before, .auth-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .btn.google{background:#fff;color:#1a1a1a;box-shadow:none;}
  .user-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:rgba(242,245,250,0.5);}
  .user-bar .email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .logout-btn{
    background:none;border:1px solid var(--line);color:rgba(242,245,250,0.6);
    font-family:'JetBrains Mono',monospace;font-size:10.5px;border-radius:8px;padding:6px 10px;cursor:pointer;flex-shrink:0;
  }
  .logout-btn:hover{border-color:var(--neg);color:var(--neg);}
</style>
</head>
<body>

<!-- ===== TELA: LOGIN ===== -->
<div id="screenAuth" class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Controle financeiro</span>
    <h1>Bússola Gastos</h1>
    <div class="auth-divider" style="margin-top:4px;"></div>

    <div id="authFields">
      <div class="auth-field">
        <label>E-mail</label>
        <input type="email" id="authEmail" autocomplete="email" placeholder="voce@exemplo.com">
      </div>
      <div class="auth-field">
        <label>Senha</label>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged,
  signInWithEmailAndPassword, createUserWithEmailAndPassword,
  GoogleAuthProvider, signInWithPopup, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ======================================================================
   CONFIGURAÇÃO DO FIREBASE
   Troque os valores abaixo pelos do SEU projeto Firebase.
   Console → Configurações do projeto → Seus apps → SDK setup and configuration.
   ====================================================================== */
const firebaseConfig = {
  apiKey: "COLOQUE_AQUI_SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
let userDocRef = null;

function setStatus(msg, isError){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = msg;
  el.style.color = isError ? '#FF8CA3' : 'rgba(242,245,250,0.4)';
}

function defaultState(){
  return { categories: [], expenses: [], incomes: [], saldoAnchor: {Dinheiro:{valor:0,criadoEm:0}, 'Cartão':{valor:0,criadoEm:0}} };
}

function normalizeState(){
  if(!state.categories) state.categories = [];
  if(!state.expenses) state.expenses = [];
  if(!state.incomes) state.incomes = [];
  if(!state.saldoAnchor) state.saldoAnchor = {Dinheiro:{valor:0,criadoEm:0}, 'Cartão':{valor:0,criadoEm:0}};

  if(state.saldoInicial){
    state.saldoAnchor.Dinheiro = {valor: state.saldoInicial.Dinheiro||0, criadoEm:0};
    state.saldoAnchor['Cartão'] = {valor: (state.saldoInicial['Cartão']||0) + (state.saldoInicial['Débito']||0), criadoEm:0};
    delete state.saldoInicial;
  }
  if(!state.saldoAnchor.Dinheiro) state.saldoAnchor.Dinheiro = {valor:0, criadoEm:0};
  if(!state.saldoAnchor['Cartão']) state.saldoAnchor['Cartão'] = {valor:0, criadoEm:0};

  state.expenses.forEach(e=>{ if(e.pagamento==='Débito') e.pagamento='Cartão'; });
  state.incomes.forEach(e=>{ if(e.pagamento==='Débito') e.pagamento='Cartão'; });
}

async function loadStateFromCloud(uid){
  userDocRef = doc(db, 'users', uid);
  try{
    const snap = await getDoc(userDocRef);
    if(snap.exists()){
      state = snap.data();
      setStatus('dados carregados da sua conta');
    }else{
      state = defaultState();
      await setDoc(userDocRef, state);
      setStatus('conta nova — nenhum dado salvo ainda');
    }
  }catch(e){
    state = defaultState();
    setStatus('⚠️ não foi possível carregar seus dados: ' + (e.message||'erro desconhecido'), true);
  }
  normalizeState();
}

/* ---------- telas: login vs app ---------- */
function showAuthScreen(){
  document.getElementById('screenAuth').style.display = 'block';
  document.getElementById('screenApp').style.display = 'none';
}
function showAppScreen(){

  document.getElementById('screenApp').style.display = 'block';
}

let authMode = 'login'; // 'login' | 'signup'

function setAuthMsg(msg, kind){
  const el = document.getElementById('authMsg');
  el.textContent = msg || '';
  el.className = 'auth-msg' + (kind ? ' '+kind : '');
}

function traduzErroAuth(code){
  const map = {
    'auth/invalid-email': 'e-mail inválido.',
    'auth/user-not-found': 'não existe conta com esse e-mail.',
    'auth/wrong-password': 'senha incorreta.',
    'auth/invalid-credential': 'e-mail ou senha incorretos.',
    'auth/email-already-in-use': 'já existe uma conta com esse e-mail.',
    'auth/weak-password': 'a senha precisa ter pelo menos 6 caracteres.',
    'auth/missing-password': 'digite sua senha.',
    'auth/too-many-requests': 'muitas tentativas — aguarde um pouco e tente de novo.'
  };
  return map[code] || 'algo deu errado. tente novamente.';
}

document.getElementById('authSwitchBtn').addEventListener('click', ()=>{
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('authSubmitBtn').textContent = authMode === 'login' ? 'Entrar' : 'Criar conta';

  document.getElementById('authSwitchBtn').textContent = authMode === 'login' ? 'Criar conta' : 'Entrar';
  setAuthMsg('');
});

document.getElementById('authSubmitBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;

  setAuthMsg('um momento...');
  try{
    if(authMode === 'login'){
      await signInWithEmailAndPassword(auth, email, password);
    }else{
      await createUserWithEmailAndPassword(auth, email, password);
    }
  }catch(e){
    setAuthMsg(traduzErroAuth(e.code), 'error');

});

document.getElementById('authGoogleBtn').addEventListener('click', async ()=>{
  setAuthMsg('um momento...');

    await signInWithPopup(auth, new GoogleAuthProvider());

onAuthStateChanged(auth, async (user)=>{
  if(user){
    document.getElementById('userEmailLabel').textContent = user.email || '';
    showAppScreen();
    setStatus('carregando seus dados...');
    await loadStateFromCloud(user.uid);
    document.getElementById('fData').value = isoDate(new Date());
    renderAll();
    showScreen('dashboard');
  }else{
    userDocRef = null;
    setAuthMsg('');
    document.getElementById('authPassword').value = '';
    showAuthScreen();
  }
});

// paleta categórica validada (contraste + distinção para daltonismo) contra o fundo escuro do app
const PALETTE = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
const DAY_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

let state = defaultState();

function saveState(){
  if(!userDocRef) return;
  setDoc(userDocRef, state)
    .then(()=>{
      const now = new Date();
      setStatus('✓ salvo às ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
    })
    .catch(e=>{
      setStatus('⚠️ erro ao salvar: ' + (e.message||'desconhecido'), true);
    });
}

function fmtBRL(v){
  return '€' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

const lastNumberValues = {};
function animateNumber(elId, target){
  const el = document.getElementById(elId);
  if(!el) return;
  const from = lastNumberValues[elId] !== undefined ? lastNumberValues[elId] : target;
  lastNumberValues[elId] = target;
  const duration = 600;
  const t0 = performance.now();
  function tick(now){
    const p = Math.min(1, (now - t0)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = from + (target - from) * eased;
    el.textContent = fmtBRL(val);
    if(p < 1) requestAnimationFrame(tick);
    else el.textContent = fmtBRL(target);
  }
  requestAnimationFrame(tick);
}

let pieAnim = null;
function renderMiniPie(viewExpenses){
  const canvas = document.getElementById('pulseWave');
  if(!canvas) return;

  const byCat = {};
  viewExpenses.forEach(e=>{ byCat[e.categoriaId] = (byCat[e.categoriaId]||0) + e.valor; });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,[,v])=>s+v,0);

  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = 92, h = 92;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);

  if(pieAnim) cancelAnimationFrame(pieAnim);

  const cx = w/2, cy = h/2, R = 38, inner = 22;
  const t0 = performance.now();
  const dur = 750;

  function frame(now){
    const p = Math.min(1, (now - t0)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    ctx.clearRect(0,0,w,h);

    if(!entries.length){
      ctx.beginPath();
      ctx.arc(cx, cy, (R+inner)/2, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(180,200,255,0.12)';
      ctx.lineWidth = R-inner;
      ctx.stroke();
      ctx.font = '8px monospace';
      ctx.fillStyle = 'rgba(242,245,250,0.3)';
      ctx.textAlign = 'center';
      ctx.fillText('—', cx, cy+3);
      return;
    }

    const spin = (now/9000) % (Math.PI*2);
    let angle = -Math.PI/2 + spin;

    entries.forEach(([catId, val])=>{
      const cat = catById(catId);
      const color = cat ? cat.color : '#888';
      const slice = (val/total) * Math.PI*2 * eased;
      ctx.beginPath();
      ctx.arc(cx, cy, (R+inner)/2, angle, angle+slice);
      ctx.strokeStyle = color;
      ctx.lineWidth = R-inner;
      ctx.stroke();
      angle += slice;
    });

    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = '#F2F5FA';
    ctx.textAlign = 'center';
    ctx.fillText(String(entries.length), cx, cy+1);
    ctx.font = '6.5px monospace';
    ctx.fillStyle = 'rgba(242,245,250,0.4)';
    ctx.fillText(entries.length===1?'CATEG.':'CATEGS.', cx, cy+11);

    pieAnim = requestAnimationFrame(frame);
  }
  pieAnim = requestAnimationFrame(frame);
}

function weekRange(now){
  const start = new Date(now); start.setHours(0,0,0,0);
  start.setDate(start.getDate() - start.getDay());
  const end = new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999);
  return {start, end};
}

function monthRange(now){
  const start = new Date(now.getFullYear(), now.getMonth(), 1, 0,0,0,0);
  const end = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59,999);
  return {start, end};
}

let catPeriod = 'semana';

function isoDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function catById(id){ return state.categories.find(c=>c.id===id); }

function renderCategories(){
  const wrap = document.getElementById('catChips');
  wrap.innerHTML = state.categories.length
    ? state.categories.map(c=>`
      <div class="chip">
        <span class="dot" style="background:${c.color};box-shadow:0 0 6px ${c.color};"></span>
        ${escapeHtml(c.label)}
        <button data-delcat="${c.id}">×</button>
      </div>`).join('')
    : `<div class="empty-state">nenhuma categoria ainda — crie a primeira abaixo</div>`;

  wrap.querySelectorAll('[data-delcat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.delcat;
      state.categories = state.categories.filter(c=>c.id!==id);
      saveState();
      renderAll();
    });
  });

  const sel = document.getElementById('fCategoria');
  const prev = sel.value;
  sel.innerHTML = state.categories.length
    ? state.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.label)}</option>`).join('')
    : `<option value="">crie uma categoria primeiro</option>`;
  if(state.categories.some(c=>c.id===prev)) sel.value = prev;
}

document.getElementById('addCatBtn').addEventListener('click', ()=>{
  const input = document.getElementById('newCatInput');
  const label = input.value.trim();
  if(!label) return;
  const newCat = {
    id:'cat'+Date.now()+Math.random().toString(36).slice(2,6),
    label,
    color: PALETTE[state.categories.length % PALETTE.length]
  };
  state.categories.push(newCat);
  input.value='';
  saveState();
  renderAll();
  document.getElementById('fCategoria').value = newCat.id;
  document.getElementById('fValor').focus();
});
document.getElementById('newCatInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('addCatBtn').click();
});

let addType = 'saida';

document.getElementById('addExpenseBtn').addEventListener('click', ()=>{
  const valor = parseFloat(document.getElementById('fValor').value);
  const data = document.getElementById('fData').value;
  const categoriaId = document.getElementById('fCategoria').value;
  const pagamento = document.getElementById('fPagamento').value;
  const descricao = document.getElementById('fDescricao').value.trim();

  if(!valor || valor<=0 || !data || !categoriaId){
    setStatus('⚠️ preencha valor, data e categoria', true);
    return;
  }

  const record = {
    id:'x'+Date.now()+Math.random().toString(36).slice(2,6),
    valor, data, categoriaId, pagamento,
    descricao: descricao || '(sem descrição)',
    criadoEm: Date.now()
  };

  if(addType==='entrada') state.incomes.push(record);
  else state.expenses.push(record);

  document.getElementById('fValor').value='';
  document.getElementById('fDescricao').value='';
  saveState();
  renderAll();
  showScreen('dashboard');
});

document.querySelectorAll('#typeToggle .ptbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    addType = btn.dataset.type;
    document.querySelectorAll('#typeToggle .ptbtn').forEach(b=> b.classList.toggle('active', b===btn));
    const isEntrada = addType==='entrada';
    document.getElementById('addScreenTitle').textContent = isEntrada ? 'Nova entrada' : 'Novo gasto';
    document.getElementById('addExpenseBtn').textContent = isEntrada ? 'Adicionar entrada' : 'Adicionar gasto';
  });
});

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderAll(){
  renderCategories();
  renderBalanceCards();

  const now = new Date();

  const {start, end} = weekRange(now);
  const weekExpenses = state.expenses.filter(e=>{
    const d = new Date(e.data+'T12:00:00');
    return d >= start && d <= end;
  });
  const total = weekExpenses.reduce((s,e)=>s+e.valor,0);

  const viewIso = selectedDayIso || isoDate(now);
  const viewExpenses = state.expenses.filter(e=>e.data===viewIso);
  const viewTotal = viewExpenses.reduce((s,e)=>s+e.valor,0);
  const viewDate = new Date(viewIso+'T12:00:00');
  const isToday = viewIso===isoDate(now);

  document.getElementById('dayLabel').textContent = isToday ? 'Gastos de hoje' : 'Gastos do dia';
  animateNumber('todayTotal', viewTotal);
  document.getElementById('todayDate').textContent = viewDate.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});
  document.getElementById('todayCount').innerHTML = `<b>${viewExpenses.length}</b> lançamento(s)`;
  document.getElementById('backTodayBtn').style.display = isToday ? 'none' : 'inline-block';
  renderTodayList(viewExpenses);
  renderMiniPie(viewExpenses);

  animateNumber('heroTotal', total);
  document.getElementById('heroRange').textContent =
    start.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}) + ' – ' + end.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
  document.getElementById('heroCount').innerHTML = `<b>${weekExpenses.length}</b> lançamento(s)`;

  const {start:mStart, end:mEnd} = monthRange(now);
  const monthExpenses = state.expenses.filter(e=>{
    const d = new Date(e.data+'T12:00:00');
    return d >= mStart && d <= mEnd;
  });

  const catData = catPeriod==='mes' ? monthExpenses : weekExpenses;
  const catTotal = catData.reduce((s,e)=>s+e.valor,0);
  renderDonut(catData, catTotal);
  renderBars(weekExpenses, start, now);

  document.getElementById('dayListHeading').textContent = catPeriod==='mes' ? 'Lançamentos do mês' : 'Lançamentos da semana';
  renderDayList(catData, catPeriod==='mes' ? mStart : start);

  renderCalendar();
}

function renderTodayList(todayExpenses){
  const area = document.getElementById('todayListArea');
  if(!todayExpenses.length){
    area.innerHTML = `<div class="empty-state">nenhum gasto registrado hoje ainda</div>`;
    return;
  }
  const items = [...todayExpenses].sort((a,b)=> b.id.localeCompare(a.id));
  area.innerHTML = items.map(e=>{
    const cat = catById(e.categoriaId);
    const color = cat ? cat.color : '#888';
    const catLabel = cat ? cat.label : 'sem categoria';
    return `<div class="expense-row" data-id="${e.id}">
      <span class="cdot" style="background:${color};box-shadow:0 0 6px ${color};"></span>
      <div class="info">
        <div class="desc">${escapeHtml(e.descricao)}</div>
        <div class="meta">${escapeHtml(catLabel)} · ${escapeHtml(e.pagamento)}</div>
      </div>
      <div class="amount">-${fmtBRL(e.valor)}</div>
      <button class="del" data-del="${e.id}">×</button>
    </div>`;
  }).join('');
  area.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.del;
      state.expenses = state.expenses.filter(e=>e.id!==id);
      saveState();
      renderAll();
    });
  });
}

function renderDonut(weekExpenses, total){
  const area = document.getElementById('donutArea');
  const byCat = {};
  weekExpenses.forEach(e=>{
    byCat[e.categoriaId] = (byCat[e.categoriaId]||0) + e.valor;
  });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  if(!entries.length){
    area.innerHTML = `<div class="empty-state">nenhum gasto registrado neste período ainda</div>`;
    return;
  }

  let acc = 0;
  const stops = entries.map(([catId, val])=>{
    const cat = catById(catId);
    const color = cat ? cat.color : 'rgba(200,200,200,0.5)';
    const pct = (val/total)*100;
    const from = acc; acc += pct;
    return `${color} ${from}% ${acc}%`;
  }).join(', ');

  const legend = entries.map(([catId,val])=>{
    const cat = catById(catId);
    const label = cat ? cat.label : 'sem categoria';
    const color = cat ? cat.color : '#888';
    return `<div class="legend-row">
      <span class="dot" style="background:${color};box-shadow:0 0 6px ${color};"></span>
      <span class="name">${escapeHtml(label)}</span>
      <span class="val">${fmtBRL(val)}</span>
    </div>`;
  }).join('');

  area.innerHTML = `
    <div class="donut-wrap">
      <div class="donut" style="background:conic-gradient(${stops});">
        <div class="donut-center">
          <div class="v">${fmtBRL(total).replace('€','').trim()}</div>
          <div class="l">total</div>
        </div>
      </div>
      <div class="legend">${legend}</div>
    </div>`;
}

function renderBars(weekExpenses, weekStart, now){
  const area = document.getElementById('barsArea');
  const totals = [0,0,0,0,0,0,0];
  weekExpenses.forEach(e=>{
    const d = new Date(e.data+'T00:00:00');
    const idx = Math.round((d - weekStart)/86400000);
    if(idx>=0 && idx<7) totals[idx]+=e.valor;
  });
  const max = Math.max(...totals, 1);
  const todayIdx = Math.round((new Date(isoDate(now)+'T00:00:00') - weekStart)/86400000);

  area.innerHTML = totals.map((v,i)=>{
    const h = Math.max((v/max)*100, v>0?4:0);
    return `<div class="bar-col ${i===todayIdx?'today':''}">
      <div class="dayval">${v>0? fmtBRL(v).replace('€','').trim() : ''}</div>
      <div class="bar" style="height:${h}%;"></div>
      <div class="daylabel">${DAY_LABELS[i]}</div>
    </div>`;
  }).join('');
}

function renderDayList(weekExpenses, weekStart){
  const area = document.getElementById('dayListArea');
  if(!weekExpenses.length){
    area.innerHTML = `<div class="empty-state">nenhum lançamento nesta semana ainda</div>`;
    return;
  }

  const byDay = {};
  weekExpenses.forEach(e=>{ (byDay[e.data] = byDay[e.data]||[]).push(e); });
  const days = Object.keys(byDay).sort((a,b)=> b.localeCompare(a));

  area.innerHTML = days.map(day=>{
    const items = byDay[day].sort((a,b)=> b.id.localeCompare(a.id));
    const dayTotal = items.reduce((s,e)=>s+e.valor,0);
    const d = new Date(day+'T12:00:00');
    const label = d.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'2-digit'});

    const rows = items.map(e=>{
      const cat = catById(e.categoriaId);
      const color = cat ? cat.color : '#888';
      const catLabel = cat ? cat.label : 'sem categoria';
      return `<div class="expense-row" data-id="${e.id}">
        <span class="cdot" style="background:${color};box-shadow:0 0 6px ${color};"></span>
        <div class="info">
          <div class="desc">${escapeHtml(e.descricao)}</div>
          <div class="meta">${escapeHtml(catLabel)} · ${escapeHtml(e.pagamento)}</div>
        </div>
        <div class="amount">-${fmtBRL(e.valor)}</div>
        <button class="del" data-del="${e.id}">×</button>
      </div>`;
    }).join('');

    return `<div class="day-group">
      <div class="day-group-head"><span>${label}</span><span class="dtotal">${fmtBRL(dayTotal)}</span></div>
      ${rows}
    </div>`;
  }).join('');

  area.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.del;
      state.expenses = state.expenses.filter(e=>e.id!==id);
      saveState();
      renderAll();
    });
  });
}

const today0 = new Date(); today0.setHours(0,0,0,0);
const earliestMonth = new Date(today0.getFullYear(), today0.getMonth()-11, 1);
const latestMonth = new Date(today0.getFullYear(), today0.getMonth(), 1);
let viewedMonth = new Date(latestMonth);
let selectedDayIso = isoDate(today0);

function expensesOnDay(iso){
  return state.expenses.filter(e=>e.data===iso);
}

function renderCalendar(){
  const label = viewedMonth.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  document.getElementById('calMonthLabel').textContent = label;
  document.getElementById('calPrev').disabled = viewedMonth <= earliestMonth;
  document.getElementById('calNext').disabled = viewedMonth >= latestMonth;

  document.getElementById('calWeekdays').innerHTML = DAY_LABELS.map(d=>`<div>${d}</div>`).join('');

  const year = viewedMonth.getFullYear(), month = viewedMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const offset = firstDay.getDay();

  let cells = '';
  for(let i=0;i<offset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const iso = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const has = expensesOnDay(iso).length>0;
    const isToday = iso===isoDate(today0);
    const isSelected = iso===selectedDayIso;
    cells += `<div class="cal-cell ${has?'has-expense':''} ${isToday?'today':''} ${isSelected?'selected':''}" data-day="${iso}">
      <span>${day}</span>${has?'<span class="dot"></span>':''}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = cells;

  document.querySelectorAll('.cal-cell[data-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedDayIso = el.dataset.day;
      renderAll();
      document.querySelector('.day-panel').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function currentBalance(method){
  const anchor = state.saldoAnchor[method] || {valor:0, criadoEm:0};
  const entradas = state.incomes
    .filter(e=>e.pagamento===method && (e.criadoEm||0) >= anchor.criadoEm)
    .reduce((s,e)=>s+e.valor,0);
  const saidas = state.expenses
    .filter(e=>e.pagamento===method && (e.criadoEm||0) >= anchor.criadoEm)
    .reduce((s,e)=>s+e.valor,0);
  return anchor.valor + entradas - saidas;
}

function renderBalanceCards(){
  const area = document.getElementById('balanceCardsArea');
  const methods = [
    {key:'Dinheiro', cls:'dinheiro'},
    {key:'Cartão', cls:'debito'}
  ];
  area.innerHTML = methods.map(m=>{
    const v = currentBalance(m.key);
    return `<div class="balance-card ${m.cls}">
      <button class="bc-edit" data-editbtn="${m.key}" title="Editar saldo">✎</button>
      <div class="bc-label">${m.key}</div>
      <div class="bc-value ${v<0?'neg':''}" data-bcvalue="${m.key}">${fmtBRL(v)}</div>
      <input type="number" step="0.01" class="bc-edit-input" data-method="${m.key}" value="${v.toFixed(2)}" style="display:none;">
    </div>`;
  }).join('');

  area.querySelectorAll('[data-editbtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const method = btn.dataset.editbtn;
      const valueEl = area.querySelector(`[data-bcvalue="${method}"]`);
      const input = area.querySelector(`.bc-edit-input[data-method="${method}"]`);
      valueEl.style.display = 'none';
      input.style.display = 'block';
      input.focus();
      input.select();
    });
  });

  function commit(input){
    const method = input.dataset.method;
    const parsed = parseFloat(input.value);
    state.saldoAnchor[method] = { valor: isNaN(parsed) ? 0 : parsed, criadoEm: Date.now() };
    saveState();
    renderAll();
  }

  area.querySelectorAll('.bc-edit-input').forEach(el=>{
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') el.blur(); });
    el.addEventListener('blur', ()=> commit(el));
  });
}

function showScreen(name){
  const dash = document.getElementById('screenDashboard');
  const add = document.getElementById('screenAdd');
  const fab = document.getElementById('fabAdd');
  if(name==='add'){
    dash.style.display='none';
    add.style.display='block';
    fab.style.display='none';
    document.getElementById('fData').value = isoDate(new Date());
    addType = 'saida';
    document.querySelectorAll('#typeToggle .ptbtn').forEach(b=> b.classList.toggle('active', b.dataset.type==='saida'));
    document.getElementById('addScreenTitle').textContent = 'Novo gasto';
    document.getElementById('addExpenseBtn').textContent = 'Adicionar gasto';
  }else{
    dash.style.display='block';
    add.style.display='none';
    fab.style.display='flex';
  }
}

(function init(){
  document.getElementById('fabAdd').addEventListener('click', ()=> showScreen('add'));
  document.getElementById('backBtn').addEventListener('click', ()=> showScreen('dashboard'));

  document.querySelectorAll('.ptbtn[data-period]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      catPeriod = btn.dataset.period;
      document.querySelectorAll('.ptbtn[data-period]').forEach(b=> b.classList.toggle('active', b===btn));
      renderAll();
    });
  });

  document.getElementById('backTodayBtn').addEventListener('click', ()=>{
    selectedDayIso = isoDate(today0);
    renderAll();
  });

  document.getElementById('calPrev').addEventListener('click', ()=>{
    if(viewedMonth <= earliestMonth) return;
    viewedMonth = new Date(viewedMonth.getFullYear(), viewedMonth.getMonth()-1, 1);
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', ()=>{
    if(viewedMonth >= latestMonth) return;
    viewedMonth = new Date(viewedMonth.getFullYear(), viewedMonth.getMonth()+1, 1);
    renderCalendar();
  });
})();
</script>
